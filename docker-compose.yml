# Milestone 2 — local Central Archive (PRD §8.2).
# A single postgres:17 container holds BOTH the dev database (420ai) and the
# test database (420ai_test). The test DB is created at first boot by the init
# script mounted into /docker-entrypoint-initdb.d/ (runs only on an empty volume).
services:
  archive:
    image: postgres:17
    container_name: 420ai-archive
    environment:
      POSTGRES_USER: 420ai
      POSTGRES_PASSWORD: 420ai
      POSTGRES_DB: 420ai
    ports:
      # Host 5433 (not 5432) — another local Postgres already owns 5432 on this
      # machine. Container still listens on 5432 internally.
      - "5433:5432"
    volumes:
      - archive-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 420ai -d 420ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP catcher for testing alert delivery (M13.5 SMTP). OPT-IN via the "mail" profile so a
  # normal `docker compose up` stays archive-only (a real deployment points ALERT_SMTP_URL at its own
  # relay). Start it with `docker compose --profile mail up -d mailpit` (or just name it directly:
  # `docker compose up -d mailpit`). Then set ingest env ALERT_SMTP_URL=smtp://localhost:1025 with any
  # FROM/TO addresses and view captured mail at http://localhost:8025.
  mailpit:
    # Pinned by digest (was floating `latest`) for reproducibility — this is the image pulled and
    # verified on 2026-07-22 (mailpit ~v1.x). Bump deliberately, not implicitly.
    image: axllent/mailpit@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
    container_name: 420ai-mailpit
    profiles: ["mail"]
    ports:
      # Loopback-only — a local test catcher must NOT be reachable from the LAN (it accepts any
      # mail with no auth and its web UI shows every captured message).
      - "127.0.0.1:1025:1025" # SMTP intake
      - "127.0.0.1:8025:8025" # web UI / REST API

volumes:
  archive-data:
